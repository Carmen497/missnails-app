<style>
/* Layout: app de una columna (máx. 560px) con barra de pestañas abajo y hojas que suben desde abajo */
:root {
  --bg: #fbf4f5;
  --surface: #ffffff;
  --surface2: #f7e8ec;
  --line: #efd9de;
  --text: #25304f;
  --muted: #87707f;
  --accent: #c8456f;
  --accent-ink: #ffffff;
  --ok: #2f7d5b;
  --shade: rgba(37, 20, 35, .42);
  --display: "Playfair Display", Georgia, serif;
  --script: "Great Vibes", "Snell Roundhand", cursive;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141016; --surface: #1e1820; --surface2: #2a2130; --line: #3a2e3d; --text: #f3e9ee; --muted: #b59fae;
    --accent: #e57399; --accent-ink: #1a0f14; --ok: #6cc79c; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141016; --surface: #1e1820; --surface2: #2a2130; --line: #3a2e3d; --text: #f3e9ee; --muted: #b59fae;
  --accent: #e57399; --accent-ink: #1a0f14; --ok: #6cc79c; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 400; font-size: 15px; line-height: 1.5; }
#app { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.1; }
h2 { font-size: 20px; }
.script { font-family: var(--script); font-weight: 400; color: var(--accent); font-size: 1.2em; }
.muted { color: var(--muted); }
small, .small { font-size: 13px; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label.upload:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 18px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); transition: transform .12s; }
.btn:active, .btn-main:active { transform: scale(.97); }
.btn-main { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 14px 22px; font-weight: 600; background: var(--accent); color: var(--accent-ink); font-size: 16px; transition: transform .12s; }
.btn-main.full, .btn.full { width: 100%; }
.btn-main.big { padding: 18px 22px; font-size: 18px; }
.btn.danger { color: #c0392b; border-color: currentColor; }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.link { color: var(--accent); font-weight: 500; }
button:disabled { opacity: .4; cursor: not-allowed; }

input[type="text"], input[type="tel"], input[type="date"], input[type="search"], input:not([type]), select, textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; font-size: 16px;
}
textarea { resize: vertical; min-height: 88px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > span:first-child { font-size: 13px; font-weight: 500; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Barra de pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Inicio */
.hello .date { color: var(--muted); margin: 0 0 2px; text-transform: capitalize; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.banner { background: var(--surface2); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: grid; gap: 8px; }

/* Listas */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > div { min-width: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); color: var(--accent); display: grid; place-items: center; font-family: var(--display); font-size: 18px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.gift { background: var(--accent); color: var(--accent-ink); }
.pill.ok { background: transparent; color: var(--ok); border: 1px solid currentColor; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.mini { width: 54px; height: 6px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin-left: auto; margin-top: 6px; }
.mini i { display: block; height: 100%; background: var(--accent); }

/* Ficha */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.topbar button { color: var(--accent); font-weight: 500; padding: 6px 0; }
.alert { border: 1.5px solid var(--accent); border-radius: 16px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.alert b { font-weight: 600; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* Tarjeta de Google Wallet */
.wcard { border-radius: 22px; overflow: hidden; box-shadow: 0 16px 34px -20px rgba(20, 0, 15, .55); max-width: 380px; margin: 0 auto; width: 100%; }
.wc-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; font-size: 14px; font-weight: 500; }
.wc-head img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.wc-title { font-size: 22px; padding: 8px 18px 0; line-height: 1.2; font-weight: 500; }
.wc-fields { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; padding: 12px 18px 14px; }
.wc-fields small { display: block; font-size: 11px; color: var(--m); font-weight: 500; }
.wc-fields b { font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.wc-fields .r { text-align: right; }
.wc-fields .wide { grid-column: 1 / -1; font-size: 14px; }
.wc-hero { display: block; width: 100%; height: auto; aspect-ratio: 1032 / 336; }
.nocard { border: 1.5px dashed var(--line); border-radius: 22px; padding: 26px 18px; text-align: center; display: grid; gap: 12px; justify-items: center; color: var(--muted); }

/* Hoja inferior */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2, .9, .3, 1); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.sheet-head button { color: var(--accent); font-weight: 500; }
.sheet-body { overflow-y: auto; padding: 16px 18px; display: grid; gap: 18px; -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px; }

.opts { display: grid; gap: 6px; }
.grp { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.opt { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 500; }
.opt .p { font-variant-numeric: tabular-nums; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.stampbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 500; }
.switch input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(20px); }

.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.swatch { border-radius: 12px; padding: 10px 6px; font-size: 13px; font-weight: 500; border: 2px solid transparent; display: grid; justify-items: center; gap: 6px; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.swatch[aria-pressed="true"] { border-color: var(--accent); }
.colorrow { display: flex; align-items: center; gap: 12px; }
input[type="color"] { width: 48px; height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--surface); }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); }
.dot[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.thumb { aspect-ratio: 1032 / 336; border-radius: 10px; background: var(--surface2) center / cover no-repeat; border: 2px solid transparent; font-size: 12px; color: var(--muted); display: grid; place-items: center; position: relative; }
.thumb[aria-pressed="true"] { border-color: var(--accent); }
.thumb .x { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 14px; line-height: 24px; }
label.upload { border: 1.5px dashed var(--line); cursor: pointer; }
label.upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.qrwrap { background: #fff; padding: 16px; border-radius: 18px; width: 252px; height: 252px; margin: 0 auto; display: grid; place-items: center; }
.qrwrap img, .qrwrap canvas { display: block; width: 220px !important; height: 220px !important; }

/* Agenda */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; color: var(--accent); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; font-size: 12px; color: var(--muted); font-weight: 500; }
.day b { font-size: 17px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.day i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day i.on { background: var(--accent); }
.day.today b { color: var(--accent); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] b { color: var(--accent-ink); }
.day[aria-pressed="true"] i.on { background: var(--accent-ink); }
.ev { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev > div { min-width: 0; }
.ev-time { font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1.25; }
.ev-time span { font-weight: 400; color: var(--muted); font-size: 13px; }
.ev .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.block { opacity: .6; }
.ev.done .t { text-decoration: line-through; text-decoration-color: var(--muted); }
.status { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.status.err { color: #c0392b; }
.info { background: var(--surface2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); animation: up .25s; }
.sec { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; }

@media (prefers-reduced-motion: reduce) { .sheet, .toast { animation: none; } .btn, .btn-main, .switch input, .switch input::after { transition: none; } }
</style>
</head>

    if (!p.cita) return '<div class="ev block">' + time + '<div><div class="t">' + esc(e.titulo || 'Ocupado') + '</div><div class="s">Hueco bloqueado</div></div><span></span></div>';
    var name = cl ? cl.name : p.name;
    return '<div class="ev' + (done ? ' done' : '') + '">' + time +
      '<div' + (cl ? ' data-a="open-client" data-id="' + cl.id + '" style="cursor:pointer"' : '') + '><div class="t">' + esc(name) + (cl ? '' : ' <span class="small" style="color:var(--accent)">nueva</span>') + '</div>' +
      '<div class="s">' + esc(p.service) + (p.diseno ? ' · ' + esc(p.diseno) : '') + '</div></div>' +
      (done ? '<span class="pill ok">✓ Terminada</span>' : '<button class="btn sm" data-a="ev-finish" data-key="' + esc(evKey(e)) + '">Terminar</button>') + '</div>';

      '<div class="s">' + dShort(v.date) + ' · ' + esc(showClient ? v.serviceName : v.method) + '</div></div>' +
      '<div style="text-align:right"><div class="num" style="font-weight:600">' + eur(v.amount) + '</div>' + (v.stamped ? '<div class="small" style="color:var(--accent)">✦ sello</div>' : '') + '</div></button>';
  }
  function rewardRow(p, showClient) {

  var VIEWS = {

        }).join('') + '</div></div>' : '') +
        (pend.length ? '<div class="sec"><h2>Regalos por entregar</h2><div class="list">' + pend.map(function (p) { return rewardRow(p, true); }).join('') + '</div></div>' : '') +
        '<div class="sec"><h2>Últimas citas</h2><div class="list">' + (last.length ? last.map(function (v) { return visitRow(v, true); }).join('') : '<div class="empty">Aquí saldrán las citas que vayas terminando.</div>') + '</div></div>' +
        '</div>';
    },

    agenda: function () {
      var day = calState.day, mon = mondayOf(day), t = today();
      var head = '<div class="between"><h1>Agenda</h1>' + (calOn() ? '<button class="btn" data-a="new-event">+ Nueva cita</button>' : '') + '</div>';
      if (!calOn()) return '<div class="stack">' + head + '<div class="panel"><h2>Conecta tu Google Calendar</h2><p class="muted" style="margin:0">Verás aquí las citas que guardas desde los WhatsApp de la web, podrás terminarlas con un toque y apuntar citas nuevas.</p><button class="btn-main" data-a="cal-config">Conectar calendario</button></div></div>';
      fetchWeek(mon);
      var c = calCache[mon], days = '';
      for (var i = 0; i < 7; i++) {
        var d = addDays(mon, i), n = eventsOn(d).filter(function (e) { return parseEv(e).cita; }).length;
        days += '<button class="day' + (d === t ? ' today' : '') + '" data-a="pick-day" data-v="' + d + '" aria-pressed="' + (d === day) + '">' +
          ['L', 'M', 'X', 'J', 'V', 'S', 'D'][i] + '<b>' + parseD(d).getDate() + '</b><i class="' + (n ? 'on' : '') + '"></i></button>';
      }
      var evs = eventsOn(day), loading = !!calState.loading[mon];
      var status = calState.error ? '<div class="status err"><span>' + esc(calState.error) + '</span><button class="link" data-a="cal-refresh">Reintentar</button></div>' :
        '<div class="status"><span>' + (loading ? 'Actualizando…' : c ? 'Actualizado a las ' + hhmm(new Date(c.at).getHours() * 60 + new Date(c.at).getMinutes()) : '') + '</span><button class="link" data-a="cal-refresh">Actualizar</button></div>';

        '<button class="link" data-a="pick-day" data-v="' + t + '">' + label + (mon !== mondayOf(t) ? ' · volver a hoy' : '') + '</button>' +
        '<button class="arrow" data-a="week" data-v="7" aria-label="Semana siguiente">›</button></div><div class="days">' + days + '</div>' + status + '</div>' +
        '<div class="sec"><h2 style="text-transform:capitalize">' + fmtLong.format(parseD(day)) + '</h2><div class="list">' +
        (evs.length ? evs.map(evRow).join('') : '<div class="empty">' + (c ? 'No hay nada este día.' : 'Cargando…') + '</div>') + '</div></div></div>';
    },

    clientas: function () {
      return '<div class="stack"><div class="between"><h1>Clientas</h1><button class="btn" data-a="new-client">+ Nueva</button></div>' +

        '<div class="list" id="client-list">' + clientList() + '</div></div>';

    ficha: function () {
      var c = client(nav.id);
      if (!c) { nav.view = 'clientas'; return VIEWS.clientas(); }

      var spent = visits.reduce(function (a, v) { return a + v.amount; }, 0), pend = pendingRewards(c.id);

        (wa ? ' · <a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + (instaLabel(c.insta) ? ' · <a href="https://instagram.com/' + encodeURIComponent(normInsta(c.insta)) + '" target="_blank" rel="noopener">' + esc(instaLabel(c.insta)) + '</a>' : '') + '</p></div>';
      if (card) {
        h += cardHTML(card, c) + '<div class="card-actions"><button class="btn sm" data-a="style-card" data-id="' + card.id + '">Cambiar estilo</button>' +

          '<button class="btn" data-a="full-reset" data-id="' + card.id + '">Ponerla a 0</button><button class="btn" data-a="full-new" data-id="' + card.id + '">Darle una nueva</button></div>' +
          '<span class="small muted">A 0: sigue siendo la misma tarjeta en su móvil. Nueva: escanea otro QR y la antigua la puede borrar.</span></div>';
      } else {
        h += '<div class="nocard"><span>' + esc(first(c.name)) + ' aún no tiene tarjeta de fidelidad.</span><button class="btn" data-a="give-card" data-id="' + c.id + '">Darle tarjeta</button></div>';
      }
      if (pend.length) h += '<div class="sec"><h2>Regalos por entregar</h2><div class="list">' + pend.map(function (p) { return rewardRow(p, false); }).join('') + '</div></div>';
      h += '<button class="btn-main full" data-a="cita" data-id="' + c.id + '">✦ Terminar cita</button>';
      h += '<div class="stats"><div class="stat"><b>' + visits.length + '</b><span>Citas</span></div><div class="stat"><b>' + eur(spent) + '</b><span>En total</span></div><div class="stat"><b>' + (visits[0] ? dShort(visits[0].date) : '—') + '</b><span>Última</span></div></div>';
      h += '<div class="sec"><div class="between"><h2>Notas privadas</h2><span class="small muted">Solo las ves tú</span></div><textarea id="note" data-in="note" data-id="' + c.id + '" placeholder="Alergias, gustos, cómo tiene las uñas…">' + esc(c.note) + '</textarea></div>';
      h += '<div class="sec"><h2>Historial</h2><div class="list">' + (visits.length ? visits.map(function (v) {
        return '<div class="item"><div class="avatar" style="font-size:13px;font-family:var(--sans)">' + dShort(v.date) + '</div><div><div class="t">' + esc(v.serviceName) + '</div><div class="s">' +
          esc([v.method, v.diseno ? 'diseño +' + v.diseno + ' €' : '', v.retirada ? 'retirada' : '', v.stamped ? '✦ sello' : ''].filter(Boolean).join(' · ')) + (v.note ? '<br>' + esc(v.note) : '') + '</div></div>' +
          '<div style="text-align:right"><div class="num" style="font-weight:600">' + eur(v.amount) + '</div><button class="small muted" data-a="delete-visit" data-id="' + v.id + '">Borrar</button></div></div>';
      }).join('') : '<div class="empty">Todavía no hay citas.</div>') + '</div></div>';
      if (old.length) h += '<div class="sec"><h2>Tarjetas anteriores</h2><div class="list">' + old.map(function (k) {

      }).join('') + '</div></div>';
      return h + '</div>';
    },

    ajustes: function () {

        '<div class="sec"><h2>Tarjeta de fidelidad</h2><div class="panel">' +
        '<label class="fld"><span>Frase de la tarjeta</span><input type="text" id="s-title" data-set="title" value="' + esc(st.title) + '" maxlength="40"></label>' +

        '<p class="small muted" style="margin:0">Las tarjetas que ya tienen las clientas no cambian solas.' + (actives ? ' <button class="link" data-a="apply-active">Aplicar sellos y regalos a las ' + actives + ' tarjetas activas</button>' : '') + '</p>' +

        '<div class="sec"><h2>Copia de seguridad</h2><div class="panel"><p class="small muted" style="margin:0">De momento los datos se guardan solo en este móvil. Cuando conectemos la nube se guardarán solos; mientras, haz una copia de vez en cuando y guárdala en Notas o envíatela por WhatsApp.</p>' +
        '<div class="row"><button class="btn" data-a="backup-copy">Copiar copia</button><button class="btn" data-a="backup-restore">Restaurar copia</button></div></div></div>' +

  function clientList() {
    var q = query.trim().toLowerCase();
    var list = S.clients.filter(function (c) {
      if (!q) return true;
      if (qmode === 'insta') return normInsta(c.insta).indexOf(normInsta(q)) > -1 && !!normInsta(c.insta);
      return c.name.toLowerCase().indexOf(q) > -1 || (q.replace(/\s/g, '') && String(c.phone).replace(/\s/g, '').indexOf(q.replace(/\s/g, '')) > -1);
    }).sort(function (a, b) { return a.name.localeCompare(b.name, 'es'); });
    if (!list.length) return '<div class="empty">' + (q ? 'No hay ninguna clienta con ' + (qmode === 'insta' ? 'el Instagram' : '') + ' «' + esc(query) + '».' : 'Aún no hay clientas. Pulsa «+ Nueva» para añadir la primera.') + '</div>';
    return list.map(function (c) {
      var card = activeCard(c.id), gift = pendingRewards(c.id).length;
      var lastV = S.visits.filter(function (v) { return v.clientId === c.id; }).map(function (v) { return v.date; }).sort().pop();
      return '<button class="item" data-a="open-client" data-id="' + c.id + '"><div class="avatar">' + initial(c.name) + '</div>' +
        '<div><div class="t">' + esc(c.name) + (c.ejemplo ? ' <span class="small muted">(ejemplo)</span>' : '') + '</div><div class="s">' + (c.insta ? esc(instaLabel(c.insta)) + ' · ' : '') + (lastV ? 'Última cita ' + dShort(lastV) : 'Sin citas') + '</div></div>' +
        '<div style="text-align:right">' + (card ? '<span class="pill' + (gift ? ' gift' : '') + '">' + (gift ? '🎁 ' : '') + card.stamps + '/' + card.total + '</span><div class="mini"><i style="width:' + Math.round(card.stamps / card.total * 100) + '%"></i></div>' : '<span class="small muted">Sin tarjeta</span>') + '</div></button>';
    }).join('');
  }

  // ---------- Hojas ----------

        title: d.id ? 'Editar clienta' : 'Nueva clienta',
        body: '<label class="fld"><span>Nombre y apellidos</span><input type="text" id="f-name" data-f="name" value="' + esc(d.name) + '" autocomplete="off" maxlength="60"></label>' +

    cita: function (d) {

      var clientField = d.fixed && cl ? '<div class="fld"><span>Clienta</span><b style="font-size:17px">' + esc(cl.name) + '</b></div>' :
        '<label class="fld"><span>Clienta</span><select id="f-client" data-f="clientId"><option value="">Elige clienta…</option>' +
        S.clients.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'es'); }).map(function (c) {

  function openSheet(type, d, returnTo) { sheet = { type: type, d: d || {}, returnTo: returnTo || null }; renderSheet(); }
  function closeSheet() { sheet = null; $('#sheet-root').innerHTML = ''; }
  function renderSheet() {
    if (!sheet) return closeSheet();
    var body = $('.sheet-body'), top = body ? body.scrollTop : 0;
    var s = SHEETS[sheet.type](sheet.d);
    $('#sheet-root').innerHTML = '<div class="shade" data-a="shade"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + s.title + '">' +
      '<div class="sheet-head"><h2>' + s.title + '</h2><button data-a="sheet-close">Cerrar</button></div>' +
      '<div class="sheet-body">' + s.body + '</div><div class="sheet-foot">' + s.foot + '</div></div></div>';
    var nb = $('.sheet-body'); if (nb) nb.scrollTop = top;
    if (s.after) s.after();
  }
  function confirmSheet(title, text, ok, danger, fn) { confirmFn = fn; openSheet('confirm', { title: title, text: text, ok: ok, danger: danger }); }
  var confirmFn = null;

  function citaAmount(d) {
    var svc = byId(S.services, d.serviceId), ret = byId(S.services, 'ret');
    if (!svc) return '';
    return String(svc.price + (svc.id === 'ret' ? 0 : d.diseno + (d.retirada && ret ? ret.price : 0)));
  }
  function startCita(clientId) {
    var d = { clientId: clientId || '', fixed: !!clientId, serviceId: '', diseno: 0, retirada: false, amount: '', amountTouched: false, method: 'Efectivo', date: today(), note: '', stamp: true, stampTouched: false, fullAction: 'reset' };
    openSheet('cita', d);
  }

  // ---------- Guardar hojas ----------
  var SAVE = {
    cliente: function (d) {
      var name = String(d.name || '').trim();
      if (!name) { toast('Escribe el nombre de la clienta.'); return; }
      var c;
      if (d.id) { c = client(d.id); c.name = name; c.phone = String(d.phone || '').trim(); c.insta = String(d.insta || '').trim(); }
      else { c = { id: uid(), name: name, phone: String(d.phone || '').trim(), insta: String(d.insta || '').trim(), note: '', created: today() }; S.clients.push(c); }
      save();
      var back = sheet.returnTo;
      if (back) { back.d.clientId = c.id; if (back.d.fromEvent) back.d.fixed = true; sheet = back; renderSheet(); render(); return; }
      closeSheet(); go('ficha', c.id); toast(d.id ? 'Guardado' : 'Clienta añadida');
    },

    cita: function (d) {
      if (!d.clientId) { d.error = 'Elige la clienta.'; return renderSheet(); }
      var svc = byId(S.services, d.serviceId);
      if (!svc) { d.error = 'Elige el servicio que le has hecho.'; return renderSheet(); }
      var v = { id: uid(), clientId: d.clientId, date: d.date || today(), serviceId: svc.id, serviceName: svc.name, diseno: svc.id === 'ret' ? 0 : d.diseno, retirada: svc.id === 'ret' ? false : d.retirada, amount: num(d.amount), method: d.method, note: String(d.note || '').trim(), stamped: false, cardId: null };
      var card = activeCard(d.clientId), msg = 'Cita guardada';
      if (card && isFull(card)) {
        if (d.fullAction === 'reset') card = closeCard(card, true);
        else if (d.fullAction === 'new') card = closeCard(card, false);
        else card = null;
      } else if (d.stamp) {
        if (!card) card = createCard(d.clientId);
      } else card = null;
      if (card) {
        card.stamps++; v.stamped = true; v.cardId = card.id;
        msg = '✦ Sello ' + card.stamps + ' de ' + card.total;
        if (card.stamps === card.r1) msg += ' · 🎁 ' + card.g1;
        if (card.stamps === card.total) msg += ' · ¡Tarjeta completa! 🎁 ' + card.g2;
      }
      if (d.eventKey) v.eventKey = d.eventKey;
      S.visits.push(v); save(); closeSheet(); go('ficha', d.clientId); toast(msg);
      if (d.eventKey && calOn()) {
        var ek = d.eventKey.split('|');
        api({ accion: 'terminar', id: ek[0], fecha: ek[1] }).then(function () {
          var e = findEvent(d.eventKey); if (e) { e.terminada = true; writeLS(CACHEK, calCache); }
        }, function () { toast('Cita guardada, pero no se ha podido marcar en el calendario.'); });
      }
    },

    calConfig: function (d) {
      var url = String(d.url || '').trim(), key = String(d.key || '').trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) { d.error = 'La dirección del script no es correcta.'; return renderSheet(); }
      if (key.length < 20) { d.error = 'Pega la clave completa.'; return renderSheet(); }
      var old = cal; cal = { url: url, key: key }; d.testing = true; d.error = ''; renderSheet();
      var mon = mondayOf(today());
      api({ accion: 'eventos', desde: mon, hasta: addDays(mon, 7) }).then(function (j) {
        writeLS(CALK, cal); calCache = {}; calCache[mon] = { at: Date.now(), events: j.eventos || [] }; writeLS(CACHEK, calCache); calState.error = '';
        closeSheet(); go('agenda'); toast('Calendario conectado');
      }, function (e) {
        cal = old; d.testing = false; d.error = calError(e); renderSheet();
      });
    },

    nuevaCita: function (d) {
      var cl = client(d.clientId), svc = byId(S.services, d.serviceId);
      if (!cl) { d.error = 'Elige la clienta.'; return renderSheet(); }
      if (!svc) { d.error = 'Elige el servicio.'; return renderSheet(); }
      if (!d.fecha || !/^\d{2}:\d{2}$/.test(d.hora || '')) { d.error = 'Elige el día y la hora.'; return renderSheet(); }
      var desc = ['Teléfono: ' + (cl.phone || '—'), 'Servicio: ' + svc.name, String(d.note || '').trim() ? 'Comentarios: ' + String(d.note).trim().slice(0, 300) : ''].filter(Boolean).join('\n');
      d.saving = true; d.error = ''; renderSheet();
      api({ accion: 'crear', titulo: '💅 ' + cl.name + ' · ' + svc.name, descripcion: desc, fecha: d.fecha, hora: d.hora, minutos: d.minutos }).then(function (j) {
        var mon = mondayOf(d.fecha);
        if (calCache[mon]) { calCache[mon].events.push(j.evento); writeLS(CACHEK, calCache); }
        calState.day = d.fecha; closeSheet(); go('agenda'); fetchWeek(mon, true); toast('Cita guardada en tu calendario');
      }, function (e) { d.saving = false; d.error = calError(e); renderSheet(); });
    },

    estilo: function (d) {
      if (d.cardId) { var card = byId(S.cards, d.cardId); card.style = copyStyle(d.style); if (d.asDefault) S.settings.style = copyStyle(d.style); }
      else S.settings.style = copyStyle(d.style);
      save(); closeSheet(); render(); toast('Estilo guardado');
    },

    servicio: function (d) {
      var name = String(d.name || '').trim(), cat = String(d.cat || '').trim() || 'Otros';
      if (!name) { d.error = 'Escribe el nombre del servicio.'; return renderSheet(); }
      if (d.id) { var s = byId(S.services, d.id); s.name = name; s.cat = cat; s.price = num(d.price); s.stamp = !!d.stamp; }
      else S.services.push({ id: uid(), name: name, cat: cat, price: num(d.price), stamp: !!d.stamp });
      save(); closeSheet(); render(); toast('Servicio guardado');
    },

    restaurar: function (d) {
      try {
        var data = cleanData(JSON.parse(d.json || ''));
        if (!data) throw new Error();
        confirmSheet('¿Restaurar la copia?', 'Se cambiarán todos los datos de este móvil por los de la copia (' + data.clients.length + ' clientas, ' + data.visits.length + ' citas).', 'Restaurar', true, function () {
          S = data; save(); closeSheet(); go('inicio'); toast('Copia restaurada');
        });
      } catch (e) { d.error = 'Eso no parece una copia de la app. Comprueba que la has pegado entera.'; renderSheet(); }
    }
  };

  // ---------- Acciones ----------

    'cal-off': function () {
      confirmSheet('¿Desconectar el calendario?', 'La app dejará de ver tus citas. Tu Google Calendar no cambia.', 'Desconectar', true, function () {
        cal = {}; calCache = {}; writeLS(CALK, cal); writeLS(CACHEK, calCache); closeSheet(); render(); toast('Calendario desconectado');
      });
    },
    'new-event': function () { var d = { clientId: '', serviceId: '', fecha: calState.day < today() ? today() : calState.day, hora: '', minutos: 120, note: '', hours: null }; openSheet('nuevaCita', d); loadHours(d); },
    'ev-finish': function (t) {
      var e = findEvent(t.dataset.key); if (!e) return;
      var p = parseEv(e), cl = matchClient(p), svc = matchService(p.service);
      var d = { clientId: cl ? cl.id : '', fixed: !!cl, fromEvent: true, eventKey: evKey(e), serviceId: svc ? svc.id : '', diseno: /elaborado/i.test(p.diseno) ? 7 : /medio/i.test(p.diseno) ? 3 : 0,
        retirada: p.retirada, amount: '', amountTouched: false, method: 'Efectivo', date: e.fecha > today() ? today() : e.fecha, note: '', stamp: svc ? !!svc.stamp : true, stampTouched: false, fullAction: 'reset',
        evInfo: [p.service, p.diseno ? 'diseño ' + p.diseno : '', p.retirada ? 'con retirada' : '', p.comentarios].filter(Boolean).join(' · ') };
      d.amount = citaAmount(d);
      if (cl) openSheet('cita', d);
      else openSheet('cliente', { name: p.name, phone: p.phone, insta: '', fromEvent: true }, { type: 'cita', d: d, returnTo: null });
    },
    'open-client': function (t) { go('ficha', t.dataset.id); },
    back: function () { go('clientas'); },
    'new-client': function () { openSheet('cliente', { name: '', phone: '', insta: '' }); },
    'edit-client': function (t) { var c = client(t.dataset.id); openSheet('cliente', { id: c.id, name: c.name, phone: c.phone, insta: c.insta || '' }); },
    'client-delete': function () {
      var c = client(sheet.d.id);
      confirmSheet('¿Borrar a ' + esc(c.name) + '?', 'Se borrarán también sus citas, notas y tarjetas. No se puede deshacer.', 'Borrar', true, function () {
        S.clients = S.clients.filter(function (x) { return x.id !== c.id; });
        S.cards = S.cards.filter(function (x) { return x.clientId !== c.id; });
        S.visits = S.visits.filter(function (x) { return x.clientId !== c.id; });
        save(); closeSheet(); go('clientas'); toast('Clienta borrada');
      });
    },
    cita: function (t) { startCita(t.dataset.id); },
    'give-card': function (t) { var c = createCard(t.dataset.id); save(); render(); openSheet('qr', { clientId: c.clientId, passId: c.passId }); },
    'show-qr': function (t) { var c = byId(S.cards, t.dataset.id); openSheet('qr', { clientId: c.clientId, passId: c.passId }); },
    'style-card': function (t) { var c = byId(S.cards, t.dataset.id); openSheet('estilo', { cardId: c.id, style: copyStyle(c.style), asDefault: false }); },
    'style-default': function () { openSheet('estilo', { cardId: null, style: copyStyle(S.settings.style) }); },
    preset: function (t) { var p = PRESETS[+t.dataset.i]; sheet.d.style.bg = p.bg; sheet.d.style.ink = p.ink; renderSheet(); },
    'reward-given': function (t) { var c = byId(S.cards, t.dataset.card); if (t.dataset.w === '1') c.r1Given = true; else c.r2Given = true; save(); render(); toast('Regalo marcado como entregado'); },
    'full-reset': function (t) { closeCard(byId(S.cards, t.dataset.id), true); save(); render(); toast('Tarjeta puesta a 0'); },
    'full-new': function (t) { var c = closeCard(byId(S.cards, t.dataset.id), false); save(); render(); openSheet('qr', { clientId: c.clientId, passId: c.passId }); },
    'undo-stamp': function (t) {
      var c = byId(S.cards, t.dataset.id); if (!c || c.stamps < 1) return;
      confirmSheet('¿Quitar el último sello?', 'La tarjeta pasará de ' + c.stamps + ' a ' + (c.stamps - 1) + ' sellos. La cita sigue guardada.', 'Quitar sello', false, function () {
        c.stamps--;
        var vs = S.visits.filter(function (v) { return v.cardId === c.id && v.stamped; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        if (vs[0]) { vs[0].stamped = false; vs[0].cardId = null; }
        save(); closeSheet(); render(); toast('Sello quitado');
      });
    },
    'delete-visit': function (t) {
      var v = byId(S.visits, t.dataset.id), card = v.cardId ? byId(S.cards, v.cardId) : null, live = card && card.status === 'activa' && card.stamps > 0;
      confirmSheet('¿Borrar esta cita?', esc(v.serviceName) + ' del ' + dShort(v.date) + ' (' + eur(v.amount) + ').' + (live ? ' También se quitará su sello de la tarjeta.' : ''), 'Borrar cita', true, function () {
        if (live) card.stamps--;
        S.visits = S.visits.filter(function (x) { return x.id !== v.id; });
        save(); closeSheet(); render(); toast('Cita borrada');
      });
    },
    'svc-new': function () { openSheet('servicio', { name: '', cat: '', price: '', stamp: true }); },
    'svc-edit': function (t) { var s = byId(S.services, t.dataset.id); openSheet('servicio', { id: s.id, name: s.name, cat: s.cat, price: String(s.price).replace('.', ','), stamp: s.stamp }); },
    'svc-delete': function () {
      var s = byId(S.services, sheet.d.id);
      confirmSheet('¿Borrar «' + esc(s.name) + '»?', 'Las citas ya guardadas con este servicio no cambian.', 'Borrar', true, function () {
        S.services = S.services.filter(function (x) { return x.id !== s.id; }); save(); closeSheet(); render(); toast('Servicio borrado');
      });
    },
    'bg-delete': function (t) {
      var id = t.dataset.id;
      confirmSheet('¿Borrar esta foto?', 'Las tarjetas que la usan se quedarán sin foto.', 'Borrar', true, function () {
        S.backgrounds = S.backgrounds.filter(function (b) { return b.id !== id; });
        S.cards.forEach(function (c) { if (c.style.img === id) c.style.img = null; });
        if (S.settings.style.img === id) S.settings.style.img = null;
        save(); closeSheet(); render();
      });
    },
    'apply-active': function () {
      var st = S.settings;
      confirmSheet('¿Aplicar a las tarjetas activas?', 'Todas pasarán a tener ' + st.total + ' sellos, primer regalo en el sello ' + st.r1 + ' (' + esc(st.g1) + ') y ' + esc(st.g2) + ' al llenarla. Los sellos que ya tienen se mantienen.', 'Aplicar', false, function () {
        S.cards.forEach(function (c) { if (c.status !== 'activa') return; c.total = st.total; c.r1 = st.r1; c.g1 = st.g1; c.g2 = st.g2; if (c.stamps > c.total) c.stamps = c.total; });
        save(); closeSheet(); render(); toast('Tarjetas actualizadas');
      });
    },
    'backup-copy': function () {
      var txt = JSON.stringify(S);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Copia copiada. Pégala en Notas o en un WhatsApp a ti misma.'); }, function () { toast('No se ha podido copiar en este navegador.'); });
      else toast('No se ha podido copiar en este navegador.');
    },
    'backup-restore': function () { openSheet('restaurar', {}); },
    'clear-examples': function () {
      confirmSheet('¿Borrar las clientas de ejemplo?', 'Se borrarán Lucía, Marta y Ana con sus citas y tarjetas. Tus clientas de verdad no se tocan.', 'Borrar ejemplos', true, function () {
        var ids = S.clients.filter(function (c) { return c.ejemplo; }).map(function (c) { return c.id; });
        S.clients = S.clients.filter(function (c) { return !c.ejemplo; });
        S.cards = S.cards.filter(function (c) { return ids.indexOf(c.clientId) < 0; });
        S.visits = S.visits.filter(function (v) { return ids.indexOf(v.clientId) < 0; });
        save(); closeSheet(); go(nav.view === 'ficha' ? 'clientas' : nav.view); toast('Ejemplos borrados');
      });
    },
    pick: function (t) {
      var d = sheet.d, k = t.dataset.k, v = t.dataset.v;
      if (k.indexOf('style.') === 0) { d.style[k.slice(6)] = v || null; return renderSheet(); }
      if (k === 'diseno' || k === 'minutos') v = +v;
      d[k] = v; d.error = '';
      if (sheet.type === 'cita') {
        if (k === 'serviceId' && !d.stampTouched) { var s = byId(S.services, v); d.stamp = !!(s && s.stamp); }
        if (!d.amountTouched) d.amount = citaAmount(d);
      }
      renderSheet();
    },
    'sheet-close': function () { if (sheet && sheet.returnTo) { sheet = sheet.returnTo; return renderSheet(); } closeSheet(); },
    'sheet-save': function () { SAVE[sheet.type](sheet.d); },
    'confirm-ok': function () { var f = confirmFn; confirmFn = null; if (f) f(); },
    shade: function (t, e) { if (e.target === t) ACT['sheet-close'](); }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t) return;
    if (t.dataset.a === 'shade' && e.target !== t) return;
    var fn = ACT[t.dataset.a];
    if (fn) { e.preventDefault(); fn(t, e); }
  });

  var noteTimer;
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.in === 'q') { query = t.value; $('#client-list').innerHTML = clientList(); return; }
    if (t.dataset.in === 'note') { var c = client(t.dataset.id); c.note = t.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 400); return; }
    if (t.dataset.set && t.type !== 'select-one') { S.settings[t.dataset.set] = t.value; save(); return; }
    if (t.dataset.f && sheet) {
      var d = sheet.d, k = t.dataset.f;
      if (t.type === 'checkbox' || t.type === 'select-one') return;
      if (sheet.type === 'estilo' && (k === 'bg' || k === 'ink')) {
        d.style[k] = t.value;
        var card = d.cardId ? byId(S.cards, d.cardId) : null;
        var sample = card || { stamps: 3, total: S.settings.total, r1: S.settings.r1, g1: S.settings.g1, g2: S.settings.g2 };
        $('#style-preview').innerHTML = cardHTML(sample, card ? client(card.clientId) : null, d.style);
        return;
      }
      d[k] = t.value;
      if (k === 'amount') d.amountTouched = true;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.set && t.type === 'select-one') {
      var st = S.settings; st[t.dataset.set] = +t.value;
      if (st.r1 >= st.total) st.r1 = Math.max(1, Math.floor(st.total / 2));
      save(); render(); return;
    }
    if (t.dataset.file === 'bg' && t.files && t.files[0]) {
      readBg(t.files[0], function (data) {
        if (!data) return toast('No se ha podido abrir esa foto.');
        var b = { id: uid(), data: data }; S.backgrounds.push(b); save();
        sheet.d.style.img = b.id; renderSheet();
      });
      return;
    }
    if (!t.dataset.f || !sheet) return;
    var d = sheet.d, k = t.dataset.f;
    if (sheet.type === 'estilo' && (k === 'bg' || k === 'ink')) { d.style[k] = t.value; return renderSheet(); }
    if (t.type === 'checkbox') {
      d[k] = t.checked;
      if (k === 'stamp') d.stampTouched = true;
      if (k === 'retirada' && !d.amountTouched) d.amount = citaAmount(d);
      if (sheet.type === 'cita') renderSheet();
      return;
    }
    if (k === 'clientId') {
      if (t.value === '__new') { var back = sheet; openSheet('cliente', { name: '', phone: '', insta: '' }, back); return; }
      d.clientId = t.value; d.error = ''; renderSheet(); return;
    }
    d[k] = t.value;
    if (sheet.type === 'nuevaCita' && k === 'fecha') { d.hours = null; d.hora = ''; renderSheet(); loadHours(d); }
  });

  // Huecos libres del día, con el mismo cálculo que la web de reservas.
  function loadHours(d) {
    if (!d.fecha) return;
    var f = d.fecha;
    fetch(cal.url + '?fecha=' + encodeURIComponent(f)).then(function (r) { return r.json(); }).then(function (j) {
      if (sheet && sheet.d === d && d.fecha === f) { d.hours = j.horas || []; renderSheet(); }
    }, function () {
      if (sheet && sheet.d === d && d.fecha === f) { d.hours = []; renderSheet(); }
    });
  }

  // Recorta la foto al tamaño de la imagen de sellos (1032×336) para que ocupe poco.
  function readBg(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var W = 1032, H = 336, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        var x = cv.getContext('2d'), sc = Math.max(W / img.width, H / img.height), w = img.width * sc, h = img.height * sc;
        x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        try { cb(cv.toDataURL('image/jpeg', 0.8)); } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }

  render();
})();
</script>
